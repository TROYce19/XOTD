{% extends 'base.html' %}

{% block content %}
<div class="panel panel-narrow" data-reveal>
    <div class="panel-head">
        <div class="panel-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
        </div>
        <h2 class="panel-title" data-i18n="registerTitle">Join XOTD</h2>
        <p class="panel-sub" data-i18n="registerSubtitle">Start sharing your knowledge today.</p>
    </div>

    <form id="register-form" class="form-stack">
        <div>
            <label class="field-label" data-i18n="usernameLabel">Username</label>
            <input type="text" id="reg-username" required minlength="2" class="field-input">
        </div>

        <div>
            <label class="field-label" data-i18n="emailLabel">Email Address</label>
            <input type="email" id="reg-email" required class="field-input">
        </div>

        <div>
            <label class="field-label" data-i18n="captchaLabel">Email Verification Code</label>
            <div class="field-row">
                <input type="text" id="reg-code" required maxlength="6" class="field-input code-input" data-i18n-placeholder="codePlaceholder">
                <button type="button" id="send-code-btn" class="btn btn-secondary send-code-btn">
                    <span data-i18n="sendCodeBtn">Send Code</span>
                </button>
            </div>
        </div>

        <div>
            <label class="field-label" data-i18n="passwordLabel">Password (Min 6 chars)</label>
            <input type="password" id="reg-password" required minlength="6" class="field-input">
        </div>

        <button type="submit" id="reg-btn" class="btn btn-primary btn-lg btn-block">
            <span data-i18n="navRegister">Sign Up</span>
        </button>
    </form>

    <div id="reg-status" class="status-msg hidden"></div>

    <p class="panel-foot">
        <span data-i18n="hasAccountMsg">Already have an account?</span>
        <a href="/login" class="text-link" data-i18n="navLogin">Login</a>
    </p>
</div>
{% endblock %}
