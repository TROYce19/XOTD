{% extends 'base.html' %}

{% block content %}
<div class="panel panel-narrow" data-reveal>
    <div class="panel-head">
        <div class="panel-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
        </div>
        <h2 class="panel-title" data-i18n="loginTitle">Welcome Back</h2>
    </div>

    <form id="login-form" class="form-stack">
        <div>
            <label class="field-label" data-i18n="usernameLabel">Username</label>
            <input type="text" id="login-username" required class="field-input">
        </div>
        <div>
            <label class="field-label" data-i18n="passwordLabel">Password</label>
            <input type="password" id="login-password" required class="field-input">
        </div>
        <button type="submit" id="login-btn" class="btn btn-primary btn-lg btn-block">
            <span data-i18n="navLogin">Login</span>
        </button>
    </form>

    <div id="login-status" class="status-msg hidden"></div>

    <p class="panel-foot">
        <span data-i18n="noAccountMsg">Don't have an account?</span>
        <a href="/register" class="text-link" data-i18n="navRegister">Sign Up</a>
    </p>
</div>
{% endblock %}
